name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  cobol-engine-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build COBOL engine image
        run: docker build -t cobol-engine-test ./cobol-engine
      - name: Start COBOL engine container
        run: docker run -d --name cobol-engine-test -p 9001:9001 cobol-engine-test
      - name: Wait for engine health check
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:9001/health && exit 0
            sleep 1
          done
          echo "engine never became healthy"; exit 1
      - name: Run COBOL business-rule regression suite
        run: bash test/cobol_engine.test.sh
      - name: Dump container logs on failure
        if: failure()
        run: docker logs cobol-engine-test

  build-all-images:
    runs-on: ubuntu-latest
    needs: [gateway-unit-tests, cobol-engine-regression]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build
