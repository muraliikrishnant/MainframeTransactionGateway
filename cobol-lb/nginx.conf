# Load-balances transaction requests across two independent COBOL engine
# instances. Stands in for how Parallel Sysplex spreads IMS/Db2 workload
# across multiple z/OS images: no single engine instance is a hard
# dependency, and a failed instance is taken out of rotation automatically.
upstream cobol_engines {
    server cobol-engine-a:9001 max_fails=2 fail_timeout=10s;
    server cobol-engine-b:9001 max_fails=2 fail_timeout=10s;
}

server {
    listen 9001;

    location / {
        proxy_pass http://cobol_engines;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_connect_timeout 2s;
    }
}
